<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gabriel Roger</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        const theme = localStorage.getItem('portfolio-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>
<body class="page-padding">

    <header class="header" id="header-container"></header>

    <section class="contact-page">
        <h1 class="section-title">Contactez-<span class="highlight-purple">moi</span><span class="underline"></span></h1>
        
        <div class="contact-container">
            <div class="contact-info">
                <h3>Une idée, un projet, une alternance ?</h3>
                <p>Je suis actuellement à la recherche d'une alternance pour la rentrée 2026. Je suis mobile sur le secteur d'Amiens avec véhicule personnel. Échangeons sur vos besoins !</p>
                
                <div class="contact-method">
                    <div class="method-icon"><i class="fa-solid fa-envelope"></i></div>
                    <div>
                        <h4>Email</h4>
                        <p>gabriel.roger.1906@gmail.com</p>
                    </div>
                </div>
                <div class="contact-method">
                    <div class="method-icon"><i class="fa-solid fa-phone"></i></div>
                    <div>
                        <h4>Téléphone</h4>
                        <p>07 81 80 19 97</p>
                    </div>
                </div>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Parlez-moi de votre projet..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Envoyer le message</button>
            </form>
        </div>
    </section>

    <footer class="footer" id="footer-container"></footer>

    <script src="js/main.js"></script>
</body>
</html>
