<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Découvrez mon parcours académique et professionnel.">
    <title>Mon Parcours | Gabriel Roger</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/logo.png" type="image/png">
    <script>
        const theme = localStorage.getItem('portfolio-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>
<body>

    <header class="header" id="header-container"></header>

    <section class="timeline-page">
        <h1 class="section-title">Mon <span class="highlight-purple">Parcours</span><span class="underline"></span></h1>
        <p style="text-align: center; color: var(--text-muted); max-width: 600px; margin: 0 auto 50px auto;">
            Découvrez mon évolution, mêlant cursus académique, expériences sur le terrain et projets de développement concrets.
        </p>
        
        <div style="text-align: center; margin-top: 60px;">
            <a href="piece_jointe/CV_ROGER_GABRIEL.pdf" download class="btn btn-primary">
                <i class="fa-solid fa-download"></i> Télécharger mon CV
            </a>
        </div>

        <div class="timeline-legend" style="display: flex; justify-content: center; gap: 20px; margin: 50px auto 10px auto; flex-wrap: wrap;">
            <span class="timeline-category cat-edu" style="margin-bottom: 0;"><i class="fa-solid fa-graduation-cap" style="margin-right: 6px;"></i> Formations & Diplômes</span>
            <span class="timeline-category cat-pro" style="margin-bottom: 0;"><i class="fa-solid fa-briefcase" style="margin-right: 6px;"></i> Expériences Pro / Stages</span>
            <span class="timeline-category cat-proj" style="margin-bottom: 0;"><i class="fa-solid fa-code" style="margin-right: 6px;"></i> Projets Universitaires</span>
        </div>

        <div class="timeline" id="container-parcours"></div>
        
    </section>

    <footer class="footer" id="footer-container"></footer>

    <script src="js/main.js"></script>
</body>
</html>
